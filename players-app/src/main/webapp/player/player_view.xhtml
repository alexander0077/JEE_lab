<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{playerView.id}" required="true"/>
        <f:viewAction action="#{playerView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2><h:outputText value="#{playerView.player.name}"/></h2></header>
            <div class="container">
                <div class="row">
                    <div class="col-4">
                        <div class="row mb-2">
                            <div class="col-6">
                                #{msg.team}
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{playerView.player.team}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                #{msg.name}
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{playerView.player.name}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                #{msg.surname}
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{playerView.player.surname}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                #{msg.shirtNumber}
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{playerView.player.shirtNumber}"/>
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                #{msg.position}
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{playerView.player.position}"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </article>
    </ui:define>

</ui:composition>

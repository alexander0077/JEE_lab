<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <article class="text--justified">
            <header><h2>#{msg.agents}</h2></header>

            <h:dataTable id="agentTable" value="#{agentList.agents.agents}" var="agent"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">
                <h:column>
                    <f:facet name="header">#{msg.login}</f:facet>
                    <h:outputText value="#{agent.login}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">#{msg.delete}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{msg.delete}"
                                         actionListener="#{agentList.deleteAction(agent)}">
                            <f:ajax execute="@this" render=":agentTable"/>
                        </h:commandButton>
                    </h:form>
                </h:column>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>

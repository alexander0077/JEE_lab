<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <article class="text--justified">
            <header><h2>#{msg.teams}</h2></header>

            <h:dataTable value="#{teamList.teams.teams}" var="team"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">
                <h:column>
                    <f:facet name="header">#{msg.name}</f:facet>
                    <h:outputText value="#{team.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">#{msg.view}</f:facet>
                    <h:link outcome="/team/team_view.xhtml" value="#{msg.view}">
                        <f:param name="id" value="#{team.id}"/>
                    </h:link>
                </h:column>

<!--                <h:column>-->
<!--                    <f:facet name="header">Edit</f:facet>-->
<!--                    <h:link outcome="/team/team_edit.xhtml" value="Edit">-->
<!--                        <f:param name="id" value="#{team.id}"/>-->
<!--                    </h:link>-->
<!--                </h:column>-->

                <h:column rendered="#{facesContext.externalContext.isUserInRole('admin')}">
                    <f:facet name="header">#{msg.delete}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{msg.delete}"
                                         action="#{teamList.deleteAction(team)}"/>
                    </h:form>
                </h:column>

<!--                <f:facet name="footer">-->
<!--                    <h:button styleClass="btn" outcome="/team/team_create__basic.xhtml"-->
<!--                              value="Create new team"/>-->
<!--                </f:facet>-->
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
